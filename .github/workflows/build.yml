name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Unpack app.zip
        run: |
          if [ -f app.zip ]; then unzip -o app.zip; fi
      - name: Build APK
        run: bash ci/build.sh
      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" Boighor.apk \
            --target "${{ github.sha }}" \
            --title "Boighor build ${{ github.run_number }}" \
            --notes "APK ডাউনলোড করে ফোনে ইনস্টল করুন।"
